name: release

# Builds the release artifacts deterministically (scripts/release/), proves they reproduce, and uploads them with
# their SHA256SUMS as a workflow artifact. Nothing is published from here: docs/release/CHECKLIST.md gates that, and a
# maintainer compares these hashes with an independent local build before uploading anything to a store or host.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # git describe for the release tag
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          # No dependency cache on the release path: a fresh, lockfile-verified install.
      - run: pnpm install --frozen-lockfile
      - name: reproducibility (two clean builds per target, the extension included)
        run: REQUIRE_ALL=1 node scripts/release/verify-reproducible.mjs
      - name: release build
        run: node scripts/release/build.mjs --out "$RUNNER_TEMP/release"
      - name: Web Store package check (permissions, justifications, zip)
        run: node apps/extension/scripts/store-package.mjs "$RUNNER_TEMP/release"
      - name: summary
        run: |
          {
            echo '### Release artifacts'
            echo '```'
            cat "$RUNNER_TEMP/release/SHA256SUMS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ github.ref_name }}
          path: ${{ runner.temp }}/release/
          retention-days: 90
