name: ci

# Every action is pinned to a full commit SHA (supply chain: a moved tag cannot change what runs here). The comment
# after each SHA is the release it was taken from; bump SHA and comment together.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FOUNDRY_VERSION: v1.3.5
  NODE_VERSION: "26"
  WASM_BINDGEN_VERSION: 0.2.117

jobs:
  typescript:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1 (version from package.json "packageManager")
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      # Lifecycle scripts: pnpm 10 runs none except the (empty) allowlist in pnpm-workspace.yaml; strictDepBuilds fails
      # the install if a new dependency wants one.
      - run: pnpm install --frozen-lockfile
      # No Rust here: packages/*/wasm/ is committed (the *-wasm jobs prove it reproduces).
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - name: forge-std for bench/contracts (it remaps ../../contracts/lib)
        run: git submodule update --init --depth 1 contracts/lib/forge-std
      - name: PQ benchmark smoke (bench/contracts is a standalone Foundry project; no devnet)
        run: pnpm --filter bench run ci

  companion-e2e:
    # Playwright on the BUILT PWA (vite build + vite preview with the production CSP), phone viewport, fake camera.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Playwright browser
        run: pnpm --filter @queuebit/companion exec playwright install --with-deps chromium
      - name: e2e (build + preview + playwright)
        env:
          CI: "1"
        run: pnpm --filter @queuebit/companion run e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: companion-e2e-traces
          path: apps/companion/test-results/
          retention-days: 7

  extension-e2e:
    # Playwright with the built MV3 extension in Chromium's new headless mode (channel "chromium", which loads
    # extensions). The 4337 tests run against a local anvil + EntryPoint v0.8 + the minimal bundler that the global
    # setup starts (devnet/deploy/up-4337.ts). The frame-native tests (payments, vault) need the EIP-8141 devnet and
    # skip themselves here; the nightly `devnet` workflow runs them.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive # forge artifacts for the 4337 deploy (kernel pulls nested libs)
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.9
      - run: pnpm install --frozen-lockfile
      - name: forge build (artifacts for devnet/deploy)
        working-directory: contracts
        run: forge build
      - name: devnet/deploy dependencies
        working-directory: devnet/deploy
        run: bun install --frozen-lockfile
      - name: Playwright browser
        run: pnpm --filter @queuebit/extension exec playwright install --with-deps chromium
      - name: e2e (wxt build + playwright)
        env:
          CI: "1"
        run: pnpm --filter @queuebit/extension run e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-e2e-traces
          path: apps/extension/test-results/
          retention-days: 7

  aa-4337-e2e:
    # contracts/devnet-tests/4337: the ERC-4337 + ERC-7579 backend on anvil (EntryPoint v0.8 at its canonical
    # address, the QueueBit modules on the reference MSA, a fresh C13 vault signature, a minimal handleOps bundler).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.9
      - name: forge build
        working-directory: contracts
        run: forge build
      - name: bun install
        working-directory: contracts/devnet-tests/4337
        run: bun install --frozen-lockfile
      - name: e2e (starts its own anvil)
        working-directory: contracts/devnet-tests/4337
        run: bun run e2e
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aa-4337-last-run
          path: contracts/devnet-tests/4337/last-run.json
          retention-days: 14

  pq-signer-wasm:
    # wasm/ is committed so JS consumers and the typescript job need no Rust toolchain.
    # This job proves the committed artifact is reproducible from rust/ (byte-for-byte).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: rust toolchain (pinned by packages/pq-signer/rust/rust-toolchain.toml)
        working-directory: packages/pq-signer/rust
        run: rustup show
      - name: cargo cache (registry and wasm-bindgen-cli; not target/, so every run rebuilds from source)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/wasm-bindgen-test-runner
          key: cargo-pq-${{ runner.os }}-${{ env.WASM_BINDGEN_VERSION }}-${{ hashFiles('packages/pq-signer/rust/Cargo.lock', 'packages/pq-signer/rust/rust-toolchain.toml') }}
      - name: wasm-bindgen-cli
        run: |
          if [ "$(wasm-bindgen --version 2>/dev/null | awk '{print $2}')" != "$WASM_BINDGEN_VERSION" ]; then
            cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked --force
          fi
      - name: rust tests
        working-directory: packages/pq-signer/rust
        run: cargo test --release --locked
      - name: rebuild wasm and diff
        working-directory: packages/pq-signer
        run: |
          bash scripts/build-wasm.sh
          git diff --exit-code -- wasm/
          test -z "$(git status --porcelain -- wasm/)" # no new untracked files either

  lean-sphincs-wasm:
    # @queuebit/lean-sphincs (leanVM leanSPHINCS for the post-quantum everyday key): same committed-wasm pattern as
    # pq-signer-wasm. The vitest suite (typescript job) checks it against native lean-pq 0.7.0 vectors.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: rust toolchain (pinned by packages/lean-sphincs/rust/rust-toolchain.toml)
        working-directory: packages/lean-sphincs/rust
        run: rustup show
      - name: cargo cache (registry, git deps and wasm-bindgen-cli; not target/)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/wasm-bindgen-test-runner
          key: cargo-lean-${{ runner.os }}-${{ env.WASM_BINDGEN_VERSION }}-${{ hashFiles('packages/lean-sphincs/rust/Cargo.lock', 'packages/lean-sphincs/rust/rust-toolchain.toml') }}
      - name: wasm-bindgen-cli
        run: |
          if [ "$(wasm-bindgen --version 2>/dev/null | awk '{print $2}')" != "$WASM_BINDGEN_VERSION" ]; then
            cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked --force
          fi
      - name: rust tests
        working-directory: packages/lean-sphincs/rust
        run: cargo test --release --locked
      - name: rebuild wasm and diff
        working-directory: packages/lean-sphincs
        run: |
          bash scripts/build-wasm.sh
          git diff --exit-code -- wasm/
          test -z "$(git status --porcelain -- wasm/)" # no new untracked files either

  groth16-wasm:
    # @queuebit/groth16 (the MIT Groth16 engine): same committed-wasm pattern as pq-signer-wasm, plus the snarkjs and
    # on-chain (forge) cross-checks, which must run here (GROTH16_REQUIRE_FORGE) rather than silently skip.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile # circuit artifacts + snarkjs (test-only)
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - name: rust toolchain (pinned by packages/groth16/rust/rust-toolchain.toml)
        working-directory: packages/groth16/rust
        run: rustup show
      - name: cargo cache (registry and wasm-bindgen-cli; not target/)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/wasm-bindgen-test-runner
          key: cargo-groth16-${{ runner.os }}-${{ env.WASM_BINDGEN_VERSION }}-${{ hashFiles('packages/groth16/rust/Cargo.lock', 'packages/groth16/rust/rust-toolchain.toml') }}
      - name: wasm-bindgen-cli
        run: |
          if [ "$(wasm-bindgen --version 2>/dev/null | awk '{print $2}')" != "$WASM_BINDGEN_VERSION" ]; then
            cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked --force
          fi
      - name: rust tests
        working-directory: packages/groth16/rust
        run: cargo test --release --locked --features native
      - name: rebuild wasm and diff
        working-directory: packages/groth16
        run: |
          bash scripts/build-wasm.sh
          git diff --exit-code -- wasm/
          test -z "$(git status --porcelain -- wasm/)"
      - name: cross-checks (snarkjs, forge on-chain verifier, @queuebit/privacy prove path)
        env:
          GROTH16_REQUIRE_FORGE: "1"
        run: pnpm vitest run --project groth16

  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # forge-std, OpenZeppelin, solady, hegota-support, the 4337/7579 hosts (pinned commits). Recursive: kernel's
          # remapped ExcessivelySafeCall is a nested submodule.
          submodules: recursive
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - name: forge build
        working-directory: contracts
        run: forge build --sizes
      - name: forge test (ci profile, 10k fuzz runs)
        working-directory: contracts
        env:
          FOUNDRY_PROFILE: ci
        run: forge test -vvv
      - name: forge fmt
        working-directory: contracts
        run: forge fmt --check
      - name: lint VERIFY-reachable code (banned opcodes, halting reads)
        working-directory: contracts
        run: ./script/lint-verify.sh

  release-reproducible:
    # The companion's static bundle and the extension zip must be byte-identical across two clean builds
    # (scripts/release/README.md).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: build the companion and the extension twice and compare
        run: REQUIRE_ALL=1 node scripts/release/verify-reproducible.mjs
