name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No Rust here: packages/pq-signer/wasm/ is committed (the pq-signer-wasm job proves it reproduces).
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: PQ benchmark smoke (forge-only, no devnet)
        run: pnpm --filter bench run ci

  pq-signer-wasm:
    # wasm/ is committed so JS consumers and the typescript job need no Rust toolchain.
    # This job proves the committed artifact is reproducible from rust/ (byte-for-byte).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: rust toolchain (pinned by packages/pq-signer/rust/rust-toolchain.toml)
        working-directory: packages/pq-signer/rust
        run: rustup show
      - name: wasm-bindgen-cli 0.2.117
        run: cargo install wasm-bindgen-cli --version 0.2.117 --locked
      - name: rust tests
        working-directory: packages/pq-signer/rust
        run: cargo test --release
      - name: rebuild wasm and diff
        working-directory: packages/pq-signer
        run: |
          bash scripts/build-wasm.sh
          git diff --exit-code -- wasm/

  groth16-wasm:
    # @leaked/groth16 (the MIT Groth16 engine): same committed-wasm pattern as pq-signer-wasm, plus the snarkjs and
    # on-chain (forge) cross-checks, which must run here (GROTH16_REQUIRE_FORGE) rather than silently skip.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile # circuit artifacts + snarkjs (test-only)
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.5
      - name: rust toolchain (pinned by packages/groth16/rust/rust-toolchain.toml)
        working-directory: packages/groth16/rust
        run: rustup show
      - name: wasm-bindgen-cli 0.2.117
        run: cargo install wasm-bindgen-cli --version 0.2.117 --locked
      - name: rust tests
        working-directory: packages/groth16/rust
        run: cargo test --release --features native
      - name: rebuild wasm and diff
        working-directory: packages/groth16
        run: |
          bash scripts/build-wasm.sh
          git diff --exit-code -- wasm/
      - name: cross-checks (snarkjs, forge on-chain verifier, @leaked/privacy prove path)
        env:
          GROTH16_REQUIRE_FORGE: "1"
        run: pnpm vitest run --project groth16

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true # forge-std, OpenZeppelin, solady, hegota-support (pinned commits)
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.5
      - name: forge build
        working-directory: contracts
        run: forge build --sizes
      - name: forge test
        working-directory: contracts
        env:
          FOUNDRY_PROFILE: ci
        run: forge test -vvv
      - name: forge fmt
        working-directory: contracts
        run: forge fmt --check
      - name: lint VERIFY-reachable code (banned opcodes, halting reads)
        working-directory: contracts
        run: ./script/lint-verify.sh
