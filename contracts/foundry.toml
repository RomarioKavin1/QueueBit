# LEAKED contracts. Settings per docs/plan/sections/10-contracts.md §10.1.2.
[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
# Exact: @forshtat/hegota-support's HegotaSupport.sol is `pragma solidity 0.8.28`.
solc_version = "0.8.28"
# Pinned for v1. TSTORE is discarded between frames (EIP-8141), which the reentrancy guard has to be tested against.
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
# KAT set C of @leaked/pq-signer, read by test/pq (C13Verifier) and test/roles.
fs_permissions = [{ access = "read", path = "../packages/pq-signer/vectors" }]
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "solady/=lib/solady/src/",
  "@forshtat/hegota-support/=lib/hegota-support/",
]

[fuzz]
runs = 1024

[invariant]
runs = 256
depth = 64

# CI: more fuzz runs, same settings otherwise.
[profile.ci]
fuzz = { runs = 10000 }

[fmt]
line_length = 120
# forge fmt only parses Solidity; standalone Yul objects (src/pq/vendor/*.yul) make `forge fmt --check` fail.
# test/privacy/vendor/: third-party sources, kept as upstream wrote them (THIRD_PARTY.md lists the edits).
ignore = ["**/*.yul", "test/privacy/vendor/**"]
