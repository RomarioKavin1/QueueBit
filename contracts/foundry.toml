# QueueBit contracts. Settings per docs/plan/sections/10-contracts.md §10.1.2.
[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
# Exact: @forshtat/hegota-support's HegotaSupport.sol is `pragma solidity 0.8.28`.
solc_version = "0.8.28"
# osaka: the account's passkeys use P256VERIFY (EIP-7951, 0x100), which its tests call for real.
evm_version = "osaka"
via_ir = true
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
# Safe v1.4.1 hits stack-too-deep under via-IR (it is built without IR upstream), so its sources compile with the
# legacy pipeline. Deployed on the devnet for the Safe -> LeanAccount migration demo (test/account/fixtures).
additional_compiler_profiles = [{ name = "legacy-pipeline", via_ir = false }]
compilation_restrictions = [{ paths = "lib/safe-smart-account/contracts/**", via_ir = false }]
fs_permissions = [
  # KAT set C of @queuebit/pq-signer, read by test/pq (C13Verifier).
  { access = "read", path = "../packages/pq-signer/vectors" },
  # LeanAccount: the WebAuthn and EIP-712 vectors its tests share with its TS SDK.
  { access = "read", path = "test/account/fixtures" },
  # test/account/SdkParity deploys Safe v1.4.1 from its artifacts (vm.deployCode; Safe compiles without via-IR).
  { access = "read", path = "out" },
]
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "solady/=lib/solady/src/",
  "@forshtat/hegota-support/=lib/hegota-support/",
  "@safe-global/safe-contracts/=lib/safe-smart-account/",
]

[fuzz]
runs = 1024

[invariant]
runs = 256
depth = 64

# CI: more fuzz runs, same settings otherwise.
[profile.ci]
fuzz = { runs = 10000 }

[fmt]
line_length = 120
# forge fmt only parses Solidity; standalone Yul objects (src/pq/vendor/*.yul) make `forge fmt --check` fail.
# test/privacy/vendor/: third-party sources, kept as upstream wrote them (THIRD_PARTY.md lists the edits).
ignore = ["**/*.yul", "test/privacy/vendor/**"]

[lint]
# Newer forge lints on build and cannot parse standalone Yul objects (src/pq/vendor/*.yul), as with [fmt] above.
ignore = ["**/*.yul", "test/privacy/vendor/**"]
