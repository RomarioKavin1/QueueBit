# QueueBit contracts. Settings per docs/plan/sections/10-contracts.md §10.1.2.
[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
# Exact: @forshtat/hegota-support's HegotaSupport.sol is `pragma solidity 0.8.28`.
solc_version = "0.8.28"
# Pinned for v1. TSTORE is discarded between frames (EIP-8141), which the reentrancy guard has to be tested against.
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
# M7: Safe v1.4.1 hits stack-too-deep under via-IR (it is built without IR upstream), so its sources and the Safe7579
# adapter that imports them compile with the legacy pipeline. Only test hosts are affected (test/modules/hosts).
additional_compiler_profiles = [{ name = "legacy-pipeline", via_ir = false }]
compilation_restrictions = [{ paths = "lib/safe-smart-account/contracts/**", via_ir = false }]
# KAT set C of @queuebit/pq-signer, read by test/pq (C13Verifier) and test/roles.
fs_permissions = [
  { access = "read", path = "../packages/pq-signer/vectors" },
  # M7: C13 signatures over QueueBitRoleExecutor digests (generated by devnet-tests/4337/gen-fixtures.ts).
  { access = "read", path = "test/modules/fixtures" },
  # M7: the canonical EntryPoint v0.8.0 initcode (deployments/ethereum/EntryPoint.json, == mainnet deploy tx input).
  { access = "read", path = "lib/account-abstraction/deployments/ethereum" },
  # M7: test/modules deploys the host accounts from their artifacts (vm.deployCode).
  { access = "read", path = "out" },
]
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "solady/=lib/solady/src/",
  "@forshtat/hegota-support/=lib/hegota-support/",
  # M7 (ERC-4337/7579 backend, src/modules + test/modules): EntryPoint v0.8.0 and the three host accounts.
  "account-abstraction/=lib/account-abstraction/contracts/",
  "@ERC4337/account-abstraction/=lib/account-abstraction/",
  "sentinellist/=lib/sentinellist/src/",
  "erc7579/=lib/erc7579-implementation/src/",
  "@rhinestone/checknsignatures/=lib/checknsignatures/",
  "@safe-global/safe-contracts/=lib/safe-smart-account/",
  "lib/safe7579/:erc7579/=lib/erc7579-safe7579-dep/src/",
  "lib/safe7579/:src/lib/ModeLib.sol=lib/safe7579/src/lib/ModeLib.sol",
  "safe7579/=lib/safe7579/src/",
  "kernel/=lib/kernel/src/",
  "ExcessivelySafeCall/=lib/kernel/lib/ExcessivelySafeCall/src/",
]

[fuzz]
runs = 1024

[invariant]
runs = 256
depth = 64

# CI: more fuzz runs, same settings otherwise.
[profile.ci]
fuzz = { runs = 10000 }

[fmt]
line_length = 120
# forge fmt only parses Solidity; standalone Yul objects (src/pq/vendor/*.yul) make `forge fmt --check` fail.
# test/privacy/vendor/: third-party sources, kept as upstream wrote them (THIRD_PARTY.md lists the edits).
ignore = ["**/*.yul", "test/privacy/vendor/**"]
