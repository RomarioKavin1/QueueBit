# LEAKED PQ benchmark: standalone Foundry project (does not touch ../../contracts).
# Default profile = the SPHINCS- upstream build (solc via-IR, optimizer 200). The vendored PORST and ETHFALCON
# sources are compiled with their own upstream settings through compilation restrictions, so their gas matches
# what their authors measure.
[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
libs = ["../../contracts/lib"]
solc_version = "0.8.34"
# Osaka: PORST uses CLZ (EIP-7939); chain 1337 runs Osaka from genesis.
evm_version = "osaka"
via_ir = true
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
remappings = ["forge-std/=../../contracts/lib/forge-std/src/"]
fs_permissions = [{ access = "read", path = "../vectors" }, { access = "read", path = "./out" }]
gas_limit = 9223372036854775807
block_gas_limit = 9223372036854775807

additional_compiler_profiles = [
  { name = "porst", via_ir = false, optimizer = false },
  { name = "ethfalcon", via_ir = false, optimizer = true, optimizer_runs = 10000 },
]
compilation_restrictions = [
  { paths = "src/vendor/porst/**", via_ir = false, optimizer = false },
  { paths = "src/vendor/ethfalcon/**", via_ir = false, optimizer_runs = 10000 },
  { paths = "src/EthFalconAdapter.sol", via_ir = false, optimizer_runs = 10000 },
]

[lint]
lint_on_build = false
